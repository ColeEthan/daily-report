name = "daily-report-ai"
main = "worker.mjs"
compatibility_date = "2026-11-19"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "daily-report-api.9006064.xyz"
custom_domain = true

[vars]
APP_ORIGIN = "https://coleethan.github.io"

[[ratelimits]]
name = "AI_RATE_LIMIT"
namespace_id = "111902"
simple = { limit = 6, period = 60 }

[observability]
enabled = false

[[durable_objects.bindings]]
name = "AI_APPROVALS"
class_name = "AiApprovals"

[[migrations]]
tag = "ai-approvals-v1"
new_sqlite_classes = ["AiApprovals"]
